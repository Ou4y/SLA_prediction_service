services:
  ai-service:
    image: ai-service-ai-service:latest
    container_name: opsmind-ai-service
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 3001
      
      # FIX: Explicitly pass these variables so Python doesn't default to localhost
      MYSQL_HOST: mysql
      MYSQL_USER: opsmind
      MYSQL_PASSWORD: opsmind
      MYSQL_DATABASE: opsmind_ai # Ensure this matches the DB you want to use
      
      # Keep these if your code uses them specifically (e.g. Prisma)
      DATABASE_URL: mysql://opsmind:opsmind@mysql:3306/Tickets
      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672
      
    networks:
      - opsmind_shared_bus
    restart: unless-stopped

  ai-ticket-consumer:
    image: ai-service-ai-service:latest
    container_name: opsmind-ai-ticket-consumer
    environment:
      # RabbitMQ (shared infrastructure)
      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672

      # Queue name published by ticket-service (adjust if your ticket service uses a different one)
      TICKET_CREATED_QUEUE: ticket_created

      # Keep DB vars available in case you later choose to persist predictions
      MYSQL_HOST: mysql
      MYSQL_USER: opsmind
      MYSQL_PASSWORD: opsmind
      MYSQL_DATABASE: opsmind_ai
    command: ["python", "-m", "training.ticket_consumer"]
    networks:
      - opsmind_shared_bus
    restart: unless-stopped

networks:
  opsmind_shared_bus:
    external: true
    name: opsmind_shared_bus