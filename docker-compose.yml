services:
  ai-service:
    image: ai-service-ai-service:latest
    container_name: opsmind-ai-service
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      
      # FIX: Explicitly pass these variables so Python doesn't default to localhost
      MYSQL_HOST: mysql
      MYSQL_USER: opsmind
      MYSQL_PASSWORD: opsmind
      MYSQL_DATABASE: opsmind_ai # Ensure this matches the DB you want to use
      
      # Keep these if your code uses them specifically (e.g. Prisma)
      DATABASE_URL: mysql://opsmind:opsmind@mysql:3306/Tickets
      RABBITMQ_URL: amqp://opsmind:opsmind@rabbitmq:5672
      CORS_ORIGINS: "*"
      
    networks:
      - opsmind-net
    restart: unless-stopped
networks:
  opsmind-net:
    external: true