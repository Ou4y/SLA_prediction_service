version: "3.9"

services:
  ai-service:
    build: .
    container_name: opsmind-ai-service
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: opsmind
      MYSQL_PASSWORD: opsmind
      MYSQL_DATABASE: opsmind_ai
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    networks:
      - opsmind-net
    restart: unless-stopped

networks:
  opsmind-net:
    external: true